name: CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: rodrs03/bot-cr-en-vivo

jobs:
  ci:
    name: CI (syntax check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check bot.py compiles
        run: python -m py_compile bot.py

  build-and-push:
    name: Build & push Docker image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -eu

            ENV_FILE=/home/deploy/.env
            if [ ! -f "$ENV_FILE" ]; then
              echo "Required environment file not found: $ENV_FILE" >&2
              exit 1
            fi

            mkdir -p /home/deploy/bot-cr-archivo
            docker pull rodrs03/bot-cr-en-vivo:latest
            docker stop bot-cr || true
            docker rm bot-cr || true
            if ! docker run -d --name bot-cr --env-file "$ENV_FILE" -v /home/deploy/bot-cr-archivo:/app/archivo:ro --restart unless-stopped rodrs03/bot-cr-en-vivo:latest; then
              echo "Failed to start bot-cr. Last container logs:" >&2
              docker logs --tail 100 bot-cr || true
              exit 1
            fi

            sleep 5
            RUNNING=$(docker inspect --format='{{.State.Running}}' bot-cr 2>/dev/null || true)
            if [ "$RUNNING" != "true" ]; then
              echo "bot-cr is not running. Last container logs:" >&2
              docker logs --tail 100 bot-cr || true
              exit 1
            fi

            echo "bot-cr is running."
