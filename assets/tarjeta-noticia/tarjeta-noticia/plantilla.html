<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(fuentes/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:M;src:url(fuentes/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:M;src:url(fuentes/montserrat-latin-500-normal.woff2);font-weight:500}
body{margin:0}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:M;color:#fff;background:#141414}
.bg{position:absolute;inset:0;background:url(BG) center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(0,0,0,.82) 72%,rgba(0,0,0,.92) 100%)}
.brand{position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px;letter-spacing:1px}
.dot{width:18px;height:18px;border-radius:50%;background:#FF7A1A;box-shadow:0 0 0 6px rgba(255,122,26,.25)}
.brand small{font-weight:500;opacity:.8;font-size:26px;letter-spacing:0}
.bottom{position:absolute;left:64px;right:64px;bottom:80px}
.chip{display:inline-flex;align-items:center;gap:12px;background:#2E9E5B;padding:12px 24px;border-radius:40px;font-weight:800;font-size:28px;letter-spacing:2px}
.chip svg{width:30px;height:30px}
h1{font-weight:800;font-size:92px;line-height:1.02;margin:28px 0 22px;text-shadow:0 4px 18px rgba(0,0,0,.5)}
h1 b{color:#FF7A1A}
p{font-weight:500;font-size:34px;line-height:1.3;margin:0 0 34px;opacity:.92}
.foot{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:22px;opacity:.75;border-top:2px solid rgba(255,255,255,.25);padding-top:22px}
/* variante sin foto */
.nophoto .bg{background:radial-gradient(circle at 80% 15%,#3a2a22 0%,#1b1512 55%,#120e0c 100%)}
.nophoto .big{position:absolute;top:190px;right:-40px;width:560px;height:560px;opacity:.13}
</style></head><body>
